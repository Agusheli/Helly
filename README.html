<?xml version="1.0" encoding="UTF-8" ?>
<!DOCTYPE html>
<html b:version='2' class='v2' expr:dir='data:blog.languageDirection' xmlns='http://www.w3.org/1999/xhtml' xmlns:b='http://www.google.com/2005/gml/b' xmlns:data='http://www.google.com/2005/gml/data' xmlns:expr='http://www.google.com/2005/gml/expr'>
<head>
  <meta content='width=device-width, initial-scale=1' name='viewport'/>
  <title><data:blog.pageTitle/></title>
  <b:include data='blog' name='all-head-content'/>
  <b:skin><![CDATA[
    body{margin:0;font-family:Arial,sans-serif;background:#f5f7fa;color:#222;line-height:1.7}
    a{color:#1a73e8;text-decoration:none}
    img{max-width:100%;height:auto}
    .wrap{max-width:760px;margin:0 auto;padding:0 16px}
    header{background:#fff;border-bottom:1px solid #e3e6ea;padding:18px 0;text-align:center}
    header h1{margin:0;font-size:24px}
    .post{background:#fff;border-radius:10px;padding:18px;margin:16px 0;box-shadow:0 1px 3px rgba(0,0,0,.06)}
    .post h2{margin:0 0 8px;font-size:20px}
    /* Rapikan tombol bagikan */
    .share-button{width:36px;height:36px;padding:6px;cursor:pointer}
    .sharing-platform-button svg,.share-button svg{width:20px;height:20px}
    .post-share-buttons ul,.dropdown-content ul{list-style:none;margin:0;padding:0}
    footer{text-align:center;padding:20px;font-size:13px;color:#777}
  ]]></b:skin>
</head>
<body>
  <header><div class='wrap'>
    <b:section class='header' id='header' maxwidgets='1' showaddelement='no'>
      <b:widget id='Header1' locked='true' title='Belajar menulis' type='Header' version='1'/>
    </b:section>
  </div></header>
  <div class='wrap'>
    <b:section class='main' id='main' showaddelement='no'>
      <b:widget id='Blog1' locked='true' title='Postingan Blog' type='Blog' version='1'/>
    </b:section>
  </div>
  <footer>© <data:blog.title/></footer>
</body>
</html>
